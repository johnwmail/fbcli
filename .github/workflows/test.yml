name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download -x
      - name: Check code formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [[ -n "$UNFORMATTED" ]]; then
            echo "The following files are not properly formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Run unit tests
        run: go test -race ./...
      - name: Validate test scripts
        run: |
          for file in testsuite/*.bash; do
            bash -n "$file"
          done
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Check module tidiness
        run: |
          go mod tidy
          if [[ -n $(git status -s) ]]; then
            echo "go.mod or go.sum are not tidy:"
            git status -s
            exit 1
          fi

  test-linux:
    name: Integration Test (Linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    services:
      filebrowser:
        image: ghcr.io/gtsteffaniak/filebrowser:stable
        ports:
          - 8080:80
        env:
          FILEBROWSER_ADMIN_PASSWORD: testpass
        options: --user root
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download -x
      - name: Wait for FileBrowser Quantum to be ready
        run: |
          echo "Waiting for FileBrowser Quantum service to start..."
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/health; then
              echo "FileBrowser is up!"
              exit 0
            fi
            echo -n .
            sleep 2
          done
          echo
          echo "FileBrowser did not become healthy in time." >&2
          exit 1
      - name: Verify server is Quantum v2
        run: |
          docker exec ${{ job.services.filebrowser.id }} /home/filebrowser/filebrowser version | tee /tmp/filebrowser-version.txt
          grep -q "v2\\." /tmp/filebrowser-version.txt
      - name: Build fbcli
        env:
          CGO_ENABLED: 0
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION_VAR=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_VAR="-X main.version=${{ github.ref_name }}"
          else
            VERSION_VAR="-X main.version=dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          go build -trimpath -v -ldflags="$VERSION_VAR" -o fbcli
      - name: Run Integration Tests
        env:
          FILEBROWSER_URL: http://localhost:8080
          FILEBROWSER_USERNAME: admin
          FILEBROWSER_PASSWORD: testpass
          # Exercise explicit --source/FILEBROWSER_SOURCE without disabling auto-detection.
          FBCLI_TEST_SOURCE: srv
        run: bash testsuite/run-tests.bash -d
      - name: Show FileBrowser logs on failure
        if: failure()
        run: docker logs ${{ job.services.filebrowser.id }} || true

  test-smoke:
    name: Smoke Test (Windows/amd64)
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Go modules
        run: go mod download -x
      - name: Run unit tests
        run: go test ./...
      - name: Build and smoke test
        env:
          CGO_ENABLED: 0
          FILEBROWSER_URL: http://127.0.0.1:1
          FILEBROWSER_USERNAME: smoke-user
          FILEBROWSER_PASSWORD: smoke-password
        shell: pwsh
        run: |
          $VERSION_VAR = "-X main.version=dev-$($env:GITHUB_SHA.Substring(0,7))"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $VERSION_VAR = "-X main.version=$env:GITHUB_REF_NAME"
          }
          go build -trimpath -v -ldflags="$VERSION_VAR" -o fbcli.exe
          ./fbcli.exe show
          $version = ./fbcli.exe --version | Out-String
          if ($version -notmatch '(?i)fbcli(\.exe)? version') { throw "unexpected --version output: $version" }
          $help = ./fbcli.exe --help | Out-String
          if ($help -notmatch 'FILEBROWSER_SOURCE') { throw "help does not document FILEBROWSER_SOURCE" }
